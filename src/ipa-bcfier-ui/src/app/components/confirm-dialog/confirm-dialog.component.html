<h1 mat-dialog-title>Confirmation</h1>
<div mat-dialog-content>
  @if (data.contentTemplate) {
  <ng-container *ngTemplateOutlet="data.contentTemplate"></ng-container>
  } @else { Are you sure you want to perform {{ data.action }}? }
</div>
<div mat-dialog-actions>
  <button mat-flat-button (click)="close(false)">
    {{ data.cancelBtnText || "Cancel" }}
  </button>
  <button mat-flat-button color="warn" (click)="close(true)">Confirm</button>
</div>
