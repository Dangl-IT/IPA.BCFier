<div class="content">
  <h2>Error Logs</h2>
  <p>
    You can view and save error logs generated by this application here. This is
    useful for troubleshooting problems.
  </p>

  <button mat-button mat-raised-button (click)="saveErrorLogs()">
    Copy Error Logs to Clipboard
  </button>
  <hr />

  <h3>Current error logs</h3>
  @if(errorLogs) {
  <pre
    >{{ errorLogs | json }}
</pre
  >
  }
</div>
